<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SWWerkplaats portal</title>
  <style>
    :root{/*DESIGN_TOKENS*/}
    *{box-sizing:border-box}body{margin:0;background:var(--color-page-background);color:var(--color-text);font-family:var(--font-family);font-size:var(--font-body);line-height:var(--line-body)}
    a{color:inherit}button,input,select{font:inherit;min-height:var(--control-minimum-target);border:0;border-radius:var(--radius-small)}
    button,.button{cursor:pointer;padding:var(--space-extra-small) var(--space-medium);background:var(--color-primary-action);color:var(--color-panel);font-weight:var(--weight-medium);text-decoration:none;border-radius:var(--radius-small)}
    button.secondary{background:var(--color-surface-subtle);color:var(--color-text)}button.danger{background:var(--color-danger)}button:disabled{opacity:.55;cursor:wait}
    button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:var(--control-focus-ring-thickness) solid var(--color-focus-ring);outline-offset:var(--control-focus-ring-offset)}
    .app-header{min-height:var(--layout-header-height);background:var(--color-panel);display:flex;align-items:center;gap:var(--space-large);padding:var(--space-small) max(var(--layout-mobile-gutter),calc((100% - var(--layout-content-max-width))/2));box-shadow:var(--shadow-panel);position:sticky;top:0;z-index:2}
    .brand{font-size:var(--font-section-title);font-weight:var(--weight-bold);white-space:nowrap}.sim{color:var(--color-warning-text);font-size:var(--font-body-small)}
    nav{display:flex;gap:var(--space-extra-small);overflow:auto;flex:1}nav a{text-decoration:none;padding:var(--space-small);border-radius:var(--radius-small);white-space:nowrap}nav a[aria-current=page]{background:var(--color-surface-selected);color:var(--color-info-text);font-weight:var(--weight-medium)}
    .actor{display:flex;gap:var(--space-extra-small);align-items:center}.actor select,.actor input{background:var(--color-surface-subtle);padding:var(--space-extra-small);max-width:var(--layout-default-sidebar-width)}
    main{max-width:var(--layout-content-max-width);margin:0 auto;padding:var(--space-extra-large) var(--layout-desktop-gutter) var(--space-three-extra-large)}
    .page-head{display:flex;align-items:end;justify-content:space-between;gap:var(--space-large);margin-bottom:var(--space-extra-large)}h1{font-size:var(--font-page-title);line-height:var(--line-compact);margin:0 0 var(--space-extra-small)}h2{font-size:var(--font-section-title);margin:0 0 var(--space-medium)}p{margin:0}.muted{color:var(--color-muted-text)}
    .panel{background:var(--color-panel);border-radius:var(--radius-panel);padding:var(--space-large);box-shadow:var(--shadow-panel);margin-bottom:var(--space-large)}
    .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(var(--layout-default-sidebar-width),1fr));gap:var(--space-medium);margin-bottom:var(--space-large)}.metric{background:var(--color-panel);border-radius:var(--radius-medium);padding:var(--space-medium)}.metric strong{display:block;font-size:var(--font-page-title)}
    .table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}caption{text-align:left;font-size:var(--font-section-title);font-weight:var(--weight-semibold);padding-bottom:var(--space-medium)}th,td{text-align:left;padding:var(--space-small);border-bottom:var(--control-focus-ring-offset) solid var(--color-divider);vertical-align:top}th{font-size:var(--font-body-small)}td.number,th.number{text-align:right}.actions{display:flex;gap:var(--space-extra-small);flex-wrap:wrap}
    .status{display:inline-block;padding:var(--space-two-extra-small) var(--space-extra-small);border-radius:var(--radius-pill);background:var(--color-surface-subtle);font-size:var(--font-body-small);font-weight:var(--weight-medium)}.status.blocked{color:var(--color-danger)}
    .empty{max-width:var(--layout-reading-max-width);padding:var(--space-extra-large);background:var(--color-surface-subtle);border-radius:var(--radius-medium)}
    .forms{display:grid;grid-template-columns:repeat(auto-fit,minmax(var(--layout-default-sidebar-width),1fr));gap:var(--space-large)}form{max-width:var(--layout-form-max-width)}.field{display:flex;flex-direction:column;gap:var(--space-two-extra-small);margin-bottom:var(--space-small)}.field input,.field select{background:var(--color-surface-subtle);padding:var(--space-extra-small)}
    .notice{padding:var(--space-medium);border-radius:var(--radius-medium);background:var(--color-surface-selected);margin-bottom:var(--space-large)}.error{background:var(--color-danger);color:var(--color-panel)}
    dialog{border:0;border-radius:var(--radius-panel);padding:var(--space-large);background:var(--color-panel);color:var(--color-text);box-shadow:var(--shadow-floating);width:min(var(--layout-form-max-width),calc(100% - var(--space-extra-large)))}dialog form{max-width:none}
    @media(max-width:/*MEDIUM_BREAKPOINT*/){.app-header{align-items:flex-start;flex-wrap:wrap}.actor{width:100%;flex-wrap:wrap}.actor input{flex:1}main{padding-left:var(--layout-mobile-gutter);padding-right:var(--layout-mobile-gutter)}.page-head{align-items:flex-start;flex-direction:column}.metrics,.forms{grid-template-columns:1fr}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <header class="app-header">
    <div><div class="brand">SWWerkplaats</div><div class="sim">Testsimulatie</div></div>
    <nav aria-label="Hoofdnavigatie" id="nav"></nav>
    <div class="actor" aria-label="Testcontext">
      <label>Rol <select id="role"></select></label>
      <label>Site <select id="site"></select></label>
      <label>Organisatie <input id="organization" autocomplete="off"></label>
      <button type="button" id="apply-context">Pas testcontext toe</button>
    </div>
  </header>
  <main id="main"><p aria-live="polite">Portalcontext laden…</p></main>
  <dialog id="action-dialog"><form id="action-dialog-form"><h2 id="action-dialog-title"></h2><div class="field"><label id="action-dialog-label" for="action-dialog-value"></label><input id="action-dialog-value" required></div><div class="actions"><button type="submit">Bevestig</button><button type="button" class="secondary" id="action-dialog-cancel">Annuleer</button></div></form></dialog>
  <div id="live" role="status" aria-live="polite"></div>
  <script>
    const store={role:'sw.portal.role',site:'sw.portal.site',org:'sw.portal.organization'};
    const state={context:null};
    function actorHeaders(){return {'X-SW-Test-Role':localStorage.getItem(store.role)||'','X-SW-Test-Site':localStorage.getItem(store.site)||'','X-SW-Test-Organization':localStorage.getItem(store.org)||''}}
    async function api(path,options){const opts=options||{};opts.headers=Object.assign({'Content-Type':'application/json'},actorHeaders(),opts.headers||{});const response=await fetch(path,opts);const text=await response.text();let value;try{value=JSON.parse(text)}catch(_){value=text}if(!response.ok)throw new Error(value&&value.error?value.error:String(value));return value}
    function e(value){return String(value==null?'':value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function money(value){return new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR'}).format(value||0)}
    function qty(value){return new Intl.NumberFormat('nl-NL',{maximumFractionDigits:2}).format(value||0)}
    function has(capability){return state.context.Actor.Capabilities.indexOf(capability)>=0}
    function status(value){const blocked=String(value).toLowerCase()==='geblokkeerd';return '<span class="status '+(blocked?'blocked':'')+'">'+e(value||'Onbekend')+'</span>'}
    function head(title,description,action){return '<div class="page-head"><div><h1>'+e(title)+'</h1><p class="muted">'+e(description)+'</p></div>'+(action||'')+'</div>'}
    function empty(title,text){return '<div class="empty"><h2>'+e(title)+'</h2><p>'+e(text)+'</p></div>'}
    function rowsOrEmpty(rows,columns){return rows.length?rows.join(''):'<tr><td colspan="'+columns+'">Nog geen gegevens voor deze selectie.</td></tr>'}
    function askValue(title,label,type){return new Promise(resolve=>{const dialog=document.getElementById('action-dialog'),form=document.getElementById('action-dialog-form'),input=document.getElementById('action-dialog-value');document.getElementById('action-dialog-title').textContent=title;document.getElementById('action-dialog-label').textContent=label;input.type=type||'text';input.value='';if(input.type==='number'){input.min='0.01';input.step='0.01'}else{input.removeAttribute('min');input.removeAttribute('step')}let done=false;const finish=value=>{if(done)return;done=true;dialog.close();resolve(value)};form.onsubmit=event=>{event.preventDefault();if(form.reportValidity())finish(input.value)};document.getElementById('action-dialog-cancel').onclick=()=>finish(null);dialog.oncancel=event=>{event.preventDefault();finish(null)};dialog.showModal();input.focus()})}
    const nav=[['/app','Overzicht',()=>true],['/','Configurator',()=>has('configure')],['/app/projects','Projecten',()=>has('project.read.all')||has('project.read.customer')],['/app/workshop','Werkplaats',()=>has('jobs.read.all')],['/app/purchasing','Inkoop',()=>has('purchasing.read')],['/app/inventory','Voorraad',()=>has('inventory.read')],['/app/customer','Klantweergave',()=>true]];
    function renderNav(){const path=location.pathname;document.getElementById('nav').innerHTML=nav.filter(x=>x[2]()).map(x=>{const active=x[0]==='/app'?path==='/app':path===x[0]||path.startsWith(x[0]+'/');return '<a href="'+x[0]+'" '+(active?'aria-current="page"':'')+'>'+e(x[1])+'</a>'}).join('')}
    function setSelectors(){const c=state.context;const role=document.getElementById('role'),site=document.getElementById('site'),org=document.getElementById('organization');role.innerHTML=c.AvailableRoles.map(x=>'<option value="'+e(x.RoleId)+'" '+(x.RoleId===c.Actor.RoleId?'selected':'')+'>'+e(x.Label)+'</option>').join('');site.innerHTML=c.AvailableSites.map(x=>'<option value="'+e(x.SiteId)+'" '+(x.SiteId===c.Actor.SiteId?'selected':'')+'>'+e(x.Name)+' · '+e(x.Status)+'</option>').join('');org.value=c.Actor.OrganizationId;document.getElementById('apply-context').onclick=()=>{localStorage.setItem(store.role,role.value);localStorage.setItem(store.site,site.value);localStorage.setItem(store.org,org.value);location.reload()}}
    async function dashboard(){const d=await api('/api/workspace/dashboard');let html=head('Overzicht','Actuele project- en uitvoeringsstatus voor '+state.context.Actor.RoleLabel+'.','<a href="/" class="button">Open configurator</a>');html+='<div class="metrics"><div class="metric"><span>Projecten</span><strong>'+d.ProjectCount+'</strong></div><div class="metric"><span>Gepubliceerd</span><strong>'+d.PublishedProjectCount+'</strong></div>'+(has('jobs.read.all')?'<div class="metric"><span>Wachtrij</span><strong>'+d.WaitingJobCount+'</strong></div><div class="metric"><span>Geblokkeerd</span><strong>'+d.BlockedJobCount+'</strong></div>':'')+(has('purchasing.read')?'<div class="metric"><span>Inkooptekorten</span><strong>'+d.PurchaseShortageCount+'</strong></div>':'')+(has('inventory.read')?'<div class="metric"><span>Lage voorraad</span><strong>'+d.LowStockCount+'</strong></div>':'')+'</div>';html+=projectTable(d.RecentProjects,'Recente projecten',false);if(has('jobs.read.all'))html+=jobTable(d.ActiveJobs,'Actieve werkplaatstaken',false);return html}
    function projectTable(projects,title,manage){const rows=projects.map(p=>'<tr><td><a href="/app/projects/'+encodeURIComponent(p.ProjectId)+'">'+e(p.ProjectId)+'</a></td><td>'+e(p.ProjectName||p.ProductName)+'</td><td>'+e(p.CustomerName||'—')+'</td><td>'+status(p.Status)+'</td><td>'+e(p.SourceSiteId||'—')+'</td><td class="number">'+money(p.PriceIncVat)+'</td>'+(manage?'<td><button class="secondary" data-publish="'+e(p.ProjectId)+'" data-value="'+(!p.CustomerPublished)+'">'+(p.CustomerPublished?'Publicatie intrekken':'Publiceren voor klant')+'</button></td>':'')+'</tr>');return '<section class="panel table-wrap"><table><caption>'+e(title)+'</caption><thead><tr><th>Project</th><th>Naam</th><th>Klant</th><th>Status</th><th>Site</th><th class="number">Incl. btw</th>'+(manage?'<th>Actie</th>':'')+'</tr></thead><tbody>'+rowsOrEmpty(rows,manage?7:6)+'</tbody></table></section>'}
    async function projects(){const data=await api('/api/workspace/projects');const manage=has('customer.publish');setTimeout(()=>document.querySelectorAll('[data-publish]').forEach(button=>button.onclick=()=>publish(button)),0);return head('Projecten','Centrale projectopslag vanuit één backendwaarheid.')+projectTable(data,'Alle toegankelijke projecten',manage)}
    async function projectDetail(projectId){const d=await api('/api/workspace/projects/'+encodeURIComponent(projectId)),p=d.Project;const documents=d.Documents.map(x=>'<tr><td>'+e(x.Category)+'</td><td>'+e(x.FileName)+'</td><td>'+status(x.Status)+'</td></tr>');const areas=d.ProductionAreas.map(x=>'<tr><td>'+e(x.Label)+'</td><td class="number">'+qty(x.ItemCount)+'</td></tr>');const purchase=d.PurchaseLines.map(x=>'<tr><td>'+e(x.Description)+'</td><td class="number">'+qty(x.RequiredQuantity)+' '+e(x.Unit)+'</td><td>'+e(x.Supplier||'Nog niet bepaald')+'</td><td class="number">'+money(x.PurchaseTotal)+'</td></tr>');const open=d.OpenData.length?'<div class="notice"><strong>Nog niet beschikbaar</strong><ul>'+d.OpenData.map(x=>'<li>'+e(x)+'</li>').join('')+'</ul></div>':'';return head(p.ProjectName||p.ProductName,'Project '+p.ProjectId+' · '+p.Status,'<a class="button" href="/app/projects">Terug naar projecten</a>')+open+'<section class="panel table-wrap"><table><caption>Documenten</caption><thead><tr><th>Soort</th><th>Bestand</th><th>Status</th></tr></thead><tbody>'+rowsOrEmpty(documents,3)+'</tbody></table></section>'+(areas.length?'<section class="panel table-wrap"><table><caption>Werkplaatsverdeling</caption><thead><tr><th>Werkgebied</th><th class="number">Onderdelen</th></tr></thead><tbody>'+areas.join('')+'</tbody></table></section>':'')+(purchase.length?'<section class="panel table-wrap"><table><caption>Project-BOM en inkoopmomentopname</caption><thead><tr><th>Artikel</th><th class="number">Benodigd</th><th>Leverancier</th><th class="number">Inkoopwaarde</th></tr></thead><tbody>'+purchase.join('')+'</tbody></table></section>':'')}
    async function publish(button){const value=button.dataset.value==='true';if(!confirm((value?'Publiceer ':'Trek publicatie in voor ')+button.dataset.publish+'?'))return;button.disabled=true;try{await api('/api/workspace/projects/'+encodeURIComponent(button.dataset.publish)+'/publication',{method:'POST',body:JSON.stringify({Published:value})});announce('Klantpublicatie bijgewerkt.');await render()}catch(error){showError(error)}finally{button.disabled=false}}
    function jobTable(jobs,title,manage){const areas={};jobs.forEach(j=>areas[j.AreaId]=j.AreaLabel);const areaOptions=Object.keys(areas).map(id=>'<option value="'+e(id)+'">'+e(areas[id])+'</option>').join('');const filter=manage?'<label>Werkgebied <select id="area-filter"><option value="">Alle werkgebieden</option>'+areaOptions+'</select></label>':'';const rows=jobs.map(j=>{const documents=j.Documents||[],documentList=documents.length?'<details><summary>'+documents.length+' bestanden</summary><ul>'+documents.map(x=>'<li>'+e(x.FileName)+'</li>').join('')+'</ul></details>':'Nog geen werkplaatsbestanden',canUpdate=manage&&(has('jobs.update.all')||has('jobs.update.'+j.AreaId)),actions=canUpdate?'<div class="actions"><button class="secondary" data-job="'+e(j.JobId)+'" data-status="Bezig">Start taak</button><button class="secondary" data-job="'+e(j.JobId)+'" data-status="Gereed">Meld gereed</button><button class="danger" data-job="'+e(j.JobId)+'" data-status="Geblokkeerd">Blokkeer</button></div>':'Alleen lezen';return '<tr data-area="'+e(j.AreaId)+'"><td>'+e(j.AreaLabel)+'</td><td><a href="/app/projects/'+encodeURIComponent(j.ProjectId)+'">'+e(j.ProjectId)+'</a></td><td>'+e(j.ProductName)+'</td><td>'+status(j.Status)+(j.BlockedReason?'<div class="muted">'+e(j.BlockedReason)+'</div>':'')+'</td><td class="number">'+qty(j.ItemCount)+'</td><td>'+documentList+'</td>'+(manage?'<td>'+actions+'</td>':'')+'</tr>'});return '<section class="panel table-wrap">'+filter+'<table><caption>'+e(title)+'</caption><thead><tr><th>Werkgebied</th><th>Project</th><th>Product</th><th>Status</th><th class="number">Onderdelen</th><th>Overzichten</th>'+(manage?'<th>Actie</th>':'')+'</tr></thead><tbody>'+rowsOrEmpty(rows,manage?7:6)+'</tbody></table></section>'}
    async function workshop(){const jobs=await api('/api/workspace/jobs');setTimeout(bindJobs,0);return head('Werkplaats','Profielenmachine, plaat-CNC, 3D-print en assemblage als afzonderlijke wachtrijen.')+jobTable(jobs,'Werkplaatswachtrij',true)}
    function bindJobs(){const filter=document.getElementById('area-filter');if(filter)filter.onchange=()=>document.querySelectorAll('[data-area]').forEach(row=>row.hidden=!!filter.value&&row.dataset.area!==filter.value);document.querySelectorAll('[data-job]').forEach(button=>button.onclick=()=>changeJob(button))}
    async function changeJob(button){let reason='';if(button.dataset.status==='Geblokkeerd'){reason=await askValue('Taak blokkeren','Reden van de blokkade','text');if(!reason)return}button.disabled=true;try{await api('/api/workspace/jobs/'+encodeURIComponent(button.dataset.job)+'/status',{method:'POST',body:JSON.stringify({Status:button.dataset.status,BlockedReason:reason})});announce('Werkplaatsstatus bijgewerkt.');await render()}catch(error){showError(error)}finally{button.disabled=false}}
    async function purchasing(){const data=await api('/api/workspace/purchasing');const rows=data.map(x=>'<tr><td>'+e(x.Description)+'</td><td>'+e(x.ProjectIds.join(', '))+'</td><td class="number">'+qty(x.RequiredQuantity)+' '+e(x.Unit)+'</td><td class="number">'+qty(x.AvailableQuantity)+' '+e(x.Unit)+'<div class="muted">'+e(x.AvailabilityStatus)+'</div></td><td class="number">'+qty(x.ShortageQuantity)+' '+e(x.Unit)+'</td><td class="number">'+qty(x.SuggestedPurchaseUnits)+' '+e(x.PurchaseUnit)+'</td><td>'+e(x.Supplier||'Nog niet bepaald')+'</td><td class="number">'+money(x.EstimatedPurchaseTotal)+'</td></tr>');return head('Inkoop','Gecombineerde behoefte per stabiel artikel, gekoppeld aan projecten en actuele voorraad.')+'<section class="panel table-wrap"><table><caption>Inkoopbehoefte</caption><thead><tr><th>Artikel</th><th>Projecten</th><th class="number">Benodigd</th><th class="number">Beschikbaar</th><th class="number">Tekort</th><th class="number">Besteladvies</th><th>Leverancier</th><th class="number">Raming</th></tr></thead><tbody>'+rowsOrEmpty(rows,8)+'</tbody></table></section>'}
    async function inventory(){const result=await Promise.all([api('/api/workspace/inventory'),api('/api/workspace/inventory-candidates')]),data=result[0],candidates=result[1],canUpdate=has('inventory.update');setTimeout(bindInventory,0);const candidateOptions=candidates.map(x=>'<option value="'+e(x.StableItemId)+'">'+e(x.Description)+' · '+e(x.StableItemId)+'</option>').join('');const rows=data.map(x=>{const actions=canUpdate?'<div class="actions"><button class="secondary" data-move="'+e(x.InventoryItemId)+'" data-type="receipt">Ontvangst</button><button class="secondary" data-move="'+e(x.InventoryItemId)+'" data-type="issue">Uitgifte</button><button class="secondary" data-move="'+e(x.InventoryItemId)+'" data-type="reserve">Reserveer</button><button class="secondary" data-move="'+e(x.InventoryItemId)+'" data-type="release">Geef vrij</button></div>':'Alleen lezen';return '<tr><td>'+e(x.Description)+'</td><td>'+e(x.StableItemId)+'</td><td>'+e(x.Location||'—')+'</td><td class="number">'+qty(x.PhysicalQuantity)+'</td><td class="number">'+qty(x.ReservedQuantity)+'</td><td class="number">'+qty(x.AvailableQuantity)+' '+e(x.StockUnit)+'</td><td>'+actions+'</td></tr>'});const form=canUpdate?'<div class="forms"><section class="panel"><h2>Voorraadartikel toevoegen</h2><form id="inventory-form"><div class="field"><label for="stable-id">Artikel uit masterdata</label><select id="stable-id" required><option value="">Kies een component of materiaal</option>'+candidateOptions+'</select></div><div class="field"><label for="stock-unit">Voorraadeenheid</label><input id="stock-unit" required></div><div class="field"><label for="purchase-unit">Inkoopeenheid</label><input id="purchase-unit" required></div><div class="field"><label for="units-per-purchase">Aantal per inkoopeenheid</label><input id="units-per-purchase" type="number" min="0.01" step="0.01" required></div><div class="field"><label for="location">Locatie</label><input id="location"></div><button type="submit">Voeg voorraadartikel toe</button></form></section></div>':'<div class="notice">Deze rol kan voorraad bekijken maar niet boeken of artikelen toevoegen.</div>';return head('Voorraad','Voor bevestigingsmaterialen en andere artikelen die per verpakking worden ingekocht.')+form+'<section class="panel table-wrap"><table><caption>Voorraadstanden</caption><thead><tr><th>Artikel</th><th>Masterdata-ID</th><th>Locatie</th><th class="number">Fysiek</th><th class="number">Gereserveerd</th><th class="number">Beschikbaar</th><th>Boeking</th></tr></thead><tbody>'+rowsOrEmpty(rows,7)+'</tbody></table></section>'}
    function bindInventory(){const form=document.getElementById('inventory-form');if(form)form.onsubmit=saveInventory;document.querySelectorAll('[data-move]').forEach(button=>button.onclick=()=>moveInventory(button))}
    async function saveInventory(event){event.preventDefault();const item={StableItemId:document.getElementById('stable-id').value,StockUnit:document.getElementById('stock-unit').value,PurchaseUnit:document.getElementById('purchase-unit').value,UnitsPerPurchase:Number(document.getElementById('units-per-purchase').value),Location:document.getElementById('location').value,TrackStock:true};try{await api('/api/workspace/inventory',{method:'POST',body:JSON.stringify(item)});announce('Voorraadartikel toegevoegd.');await render()}catch(error){showError(error)}}
    async function moveInventory(button){const raw=await askValue('Voorraad boeken','Hoeveelheid','number');if(raw===null)return;const quantity=Number(String(raw).replace(',','.'));if(!quantity){showError(new Error('Voer een hoeveelheid groter dan nul in.'));return}try{await api('/api/workspace/inventory/'+encodeURIComponent(button.dataset.move)+'/movement',{method:'POST',body:JSON.stringify({MovementType:button.dataset.type,Quantity:quantity})});announce('Voorraadboeking verwerkt.');await render()}catch(error){showError(error)}}
    async function customer(){if(!has('project.read.customer'))return head('Klantweergave','Test het echte beperkte klantcontract.')+'<div class="notice">Kies bovenin de rol Klant en vul dezelfde organisatiecode in als bij het project. Alleen gepubliceerde projecten worden dan door de backend teruggegeven.</div>';const data=await api('/api/workspace/projects');return head('Mijn orders','Alleen informatie die voor deze klantorganisatie is gepubliceerd.')+projectTable(data,'Lopende en afgeronde orders',false)}
    function announce(message){document.getElementById('live').textContent=message}
    function showError(error){document.getElementById('main').insertAdjacentHTML('afterbegin','<div class="notice error" role="alert">'+e(error.message||error)+'</div>')}
    async function render(){renderNav();const main=document.getElementById('main');main.innerHTML='<p aria-live="polite">Gegevens laden…</p>';try{const route=location.pathname;let html;if(route.startsWith('/app/projects/'))html=await projectDetail(decodeURIComponent(route.substring('/app/projects/'.length)));else if(route==='/app/projects')html=await projects();else if(route==='/app/workshop')html=has('jobs.read.all')?await workshop():empty('Geen toegang','Deze rol kan geen werkplaatswachtrijen bekijken.');else if(route==='/app/purchasing')html=has('purchasing.read')?await purchasing():empty('Geen toegang','Deze rol kan geen inkoopinformatie bekijken.');else if(route==='/app/inventory')html=has('inventory.read')?await inventory():empty('Geen toegang','Deze rol kan geen voorraad bekijken.');else if(route==='/app/customer')html=await customer();else html=has('dashboard.read')?await dashboard():await customer();main.innerHTML=html}catch(error){main.innerHTML=head('Portal kon niet laden','Controleer de gekozen testcontext.')+empty('Fout',error.message||String(error))}}
    (async()=>{try{state.context=await api('/api/workspace/context');localStorage.setItem(store.role,state.context.Actor.RoleId);localStorage.setItem(store.site,state.context.Actor.SiteId);localStorage.setItem(store.org,state.context.Actor.OrganizationId);setSelectors();await render()}catch(error){document.getElementById('main').innerHTML=empty('Portalcontext kon niet laden',error.message||String(error))}})();
  </script>
